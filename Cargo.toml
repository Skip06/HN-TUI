[package]
name = "hn_tui"
version = "0.1.1"
edition = "2024"
description = "A terminal UI for Hacker News"
repository = "https://github.com/Skip06/HN-TUI"
license = "MIT"
readme = "README.md"
keywords = ["hacker-news", "tui", "terminal"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30.0"
crossterm = "0.29.0"
color-eyre = "0.6.5"
open = "5.3.3"
futures = "0.3.32"
